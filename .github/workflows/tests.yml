name: Portfolio checks
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '30 12 * * 1'
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
        include:
          - os: ubuntu-latest
            python: '3.13'
            pandas: '<3'
    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - if: matrix.pandas == '<3'
        run: python -m pip install 'pandas<3'
      - run: python -m pytest -q
      - run: python -c "import streamlit as st; assert st.get_option('server.maxUploadSize') == 50; assert st.get_option('client.toolbarMode') == 'viewer'; assert st.get_option('client.showErrorDetails') == 'type'"
